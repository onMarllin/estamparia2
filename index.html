<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Golpe de Prensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#14181d;--panel:#1d232a;--panel2:#262e37;--edge:#0a0d10;--line:#394451;--text:#e9edf0;--muted:#98a6b3;
  --yel:#f2c230;--yelDim:#8a6f1e;--green:#5cc26b;--red:#ec5a50;--blue:#55a3e6;--orange:#f0923a;--grey:#6d7a87;--purple:#b98ae6;
  --btn:#f2c230;--btnText:#1a1406;--btnSh:#9c7a14;--btnHi:#ffe07a;
  --display:'Silkscreen','Pixelify Sans',ui-monospace,'Courier New',monospace;
  --font:'Pixelify Sans',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
.page{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}.tiny{font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--orange)}.info{color:var(--blue)}.gold{color:var(--yel)}

/* ---------- cabeçalho ---------- */
header.top{background:var(--panel);border:3px solid var(--edge);border-top:0;margin-inline:-16px;padding:12px 16px 0}
.brandrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:12px;color:var(--yel);letter-spacing:.06em}
.plant{font-family:var(--display);font-size:clamp(20px,4.2vw,30px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.clock{font-family:var(--display);font-size:17px;color:var(--muted)}
.hudrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:10px;padding-bottom:12px}
.cash{font-family:var(--display);font-size:24px;font-weight:700;color:var(--yel)}
.cash.neg{color:var(--red)}
.stars{font-size:18px;letter-spacing:2px;color:var(--yelDim)}
.stars b{color:var(--yel);font-weight:400}
.ctrl{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.ctrl button{font:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--panel2);border:2px solid var(--edge);padding:4px 10px;cursor:pointer}
.ctrl button[aria-pressed="true"]{background:var(--yel);color:var(--btnText)}
.ctrl .sep{width:6px}
.hazard{height:10px;margin-inline:-16px;background:repeating-linear-gradient(-45deg,var(--yel) 0 12px,var(--edge) 12px 24px)}
.mission{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border:2px dashed var(--yelDim);background:#1f1d14}
.mission .tag{font-family:var(--display);font-size:12px;color:var(--btnText);background:var(--yel);padding:2px 6px;flex:none}
.mission .rw{margin-left:auto;color:var(--yel);white-space:nowrap;font-size:15px}
.mission.go{border-style:solid;border-color:var(--purple);background:#221c33}
.mission.go .tag{background:var(--purple);color:#1a1030}
.mission.go .btn{margin-left:auto}
/* universo e nível */
.lvrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
.lvrow .uni{font-size:14px;color:var(--purple);border:2px solid #4a3f6b;background:#221c33;padding:1px 8px}
.lvbar{display:block;width:140px;height:10px;background:var(--edge);border:2px solid var(--edge)}
.lvbar i{display:block;height:100%;width:0;background:var(--purple);transition:width .3s linear}
/* progresso */
.salto{border-color:var(--edge);box-shadow:inset 0 0 0 2px #4a3f6b}
.portalrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.portalrow canvas{width:96px;height:96px;background:#120e1c;border:3px solid var(--edge)}
.pips{display:flex;gap:3px;flex-wrap:wrap}.pips i{width:10px;height:10px;border:2px solid var(--edge);background:var(--line)}.pips i.on{background:var(--purple)}
.tech .btn{align-self:flex-start}
/* ranking */
.tbl{overflow-x:auto}
table.rank{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.rank th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.rank td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.rank .r{text-align:right}
table.rank td{white-space:nowrap}
table.rank td .fab{display:block;font-size:12px}
table.rank tr.me td{background:#2c2640}
table.rank tr.me td:first-child{box-shadow:inset 4px 0 0 var(--purple)}
.pos{font-family:var(--display);font-size:14px}
.pos.p1{color:#f2c230}.pos.p2{color:#c9d3da}.pos.p3{color:#d08a4a}
/* portal entre universos */
.portal{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff4c0 0 4%,#f2c230 4% 9%,#b98ae6 9% 16%,#55a3e6 16% 24%,#221c33 24% 60%,#0a0d10 60%);animation:portal 1.8s steps(12) forwards}
@keyframes portal{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(3)}}

/* ---------- abas ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--bg);padding:10px 0 8px;margin-top:4px}
.tabs button{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 -3px 0 var(--line);padding:8px 4px 10px;cursor:pointer;position:relative}
.tabs button[aria-current="page"]{background:var(--yel);color:var(--btnText);box-shadow:inset 0 -3px 0 var(--btnSh)}
.badge{position:absolute;top:-9px;right:-4px;background:var(--red);color:#fff;border:2px solid var(--edge);font-size:12px;min-width:22px;padding:0 4px}

/* ---------- blocos ---------- */
.panel{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line);padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.grid>*{min-width:0}
.card{background:var(--panel2);border:3px solid var(--edge);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:13px;padding:1px 7px;border:2px solid currentColor;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;margin:0}
.facts div{background:var(--panel);border:2px solid var(--line);padding:4px 8px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--edge);border:2px solid var(--edge)}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s linear}
.bar.y i{background:var(--yel)}.bar.b i{background:var(--blue)}.bar.r i{background:var(--red)}
.barlab{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:8px}
.empty{color:var(--muted);padding:6px 0}

/* ---------- botões ---------- */
.btn{font:inherit;font-size:15px;font-weight:600;color:var(--btnText);background:var(--btn);border:3px solid var(--edge);box-shadow:inset 0 -3px 0 var(--btnSh),inset 0 3px 0 var(--btnHi);padding:6px 12px 8px;cursor:pointer;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--text);box-shadow:inset 0 -3px 0 var(--line)}
.btn.danger{background:var(--panel);color:var(--red);box-shadow:inset 0 -3px 0 var(--line)}
.btn.sm{font-size:14px;padding:4px 9px 6px}
.btn.wide{width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
select,input[type=text]{font:inherit;font-size:15px;color:var(--text);background:var(--panel);border:2px solid var(--line);padding:5px 8px;width:100%;min-width:0}

/* ---------- chão de fábrica ---------- */
.floor{display:grid;grid-template-columns:auto 340px;justify-content:center;gap:14px;align-items:start;margin-top:14px}
.scenecol{min-width:0}
/* a cena ocupa a largura disponível, mas nunca passa da altura da tela */
.scene{position:relative;border:3px solid var(--edge);box-shadow:0 0 0 2px var(--line);background:#2a3038;width:min(calc(100vw - 400px),calc(1320px - 400px),max(600px,calc((100vh - 200px) * 1.136)))}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.side .panel{margin-top:0}
.teambox{flex:0 1 auto;gap:8px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#4a5563 transparent}
.linkbtn{font:inherit;font-size:13px;color:var(--yel);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rtile{background:var(--panel2);border:2px solid var(--edge);padding:5px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rth{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rth .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rth b{color:var(--text);font-family:var(--display);font-size:12px}
.faces{display:flex;flex-wrap:wrap;gap:3px}
.faces button{background:#2a3038;border:1px solid var(--edge);padding:0;cursor:pointer;line-height:0}
.faces canvas{width:20px;height:32px}
.faces .more{font:inherit;font-size:12px;color:var(--text);width:22px;height:34px;line-height:1}
.feedbox{flex:1 1 0;min-height:140px;overflow:hidden}
.feedbox .feed{overflow-y:auto;min-height:0;padding-right:4px;overscroll-behavior:contain}
.feedbox .feed{scrollbar-width:thin;scrollbar-color:#4a5563 transparent}
.riscado{text-decoration:line-through}
.card.owned{opacity:.7}
.card.flash{border-color:#8a6f1e;box-shadow:inset 0 0 0 2px var(--yel)}
.card.flash h3{font-size:19px}
.panel.quiet{background:transparent;box-shadow:none;border-style:dashed;border-color:var(--line)}
.card.urg{border-color:#8a6f1e;box-shadow:inset 0 0 0 2px var(--yel)}
.pill.urgp{color:var(--red);font-weight:700;animation:blink2 1s steps(2) infinite}
@keyframes blink2{50%{opacity:.55}}
.urgtxt{font-size:14px;color:var(--yel)}
.mcard{border-left:6px solid var(--c)}
.streak{display:flex;gap:4px;flex-wrap:wrap}
.streak i{font-style:normal;min-width:34px;height:30px;padding:0 4px;border:2px solid var(--edge);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12px;color:var(--muted)}
.streak i.gem{color:var(--purple)}
.streak i.on{background:var(--yel);color:var(--btnText)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.big3 div{background:var(--panel2);border:3px solid var(--edge);padding:8px 10px;min-width:0}
.big3 dt{font-size:13px;color:var(--muted)}
.big3 dd{margin:0;font-family:var(--display);font-size:clamp(12px,3.4vw,20px);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.grid.tight .card{padding:9px;gap:6px}
.grid.tight .portrait{width:44px;height:70px}
.scene canvas{width:100%;height:auto;cursor:pointer}
.scene .ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scene .lab{position:absolute;font-family:var(--display);font-size:10px;color:#e9edf0;text-shadow:1px 1px 0 #0a0d10;transform:translate(0,-2px);white-space:nowrap}
.scene .lab.empty{color:var(--yel)}
.scene .fl{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:15px;color:var(--yel);text-shadow:2px 2px 0 #0a0d10;white-space:nowrap;animation:up 1.9s steps(19) forwards}
.scene .fl.bad{color:var(--red)}.scene .fl.good{color:var(--green)}.scene .fl.info{color:var(--blue)}.scene .fl.big{font-size:19px}
@keyframes up{0%{opacity:0;margin-top:6px}10%{opacity:1}75%{opacity:1}100%{opacity:0;margin-top:-34px}}
.scene.shake{animation:shk .35s steps(6)}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.feed time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.feed li.bad span{color:var(--red)}.feed li.good span{color:var(--green)}.feed li.warn span{color:var(--orange)}.feed li.info span{color:var(--blue)}.feed li.gold span{color:var(--yel)}
.team{display:flex;flex-wrap:wrap;gap:6px}
.teamg{display:flex;flex-direction:column;gap:4px}
.teamg .team{margin-bottom:6px}
.teamg .tl{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.teamg .tl b{color:var(--text)}
.sw{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);flex:none}
.grp{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.grph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:17px;border-bottom:2px dashed var(--line);padding-bottom:6px}
.grph .cnt{font-family:var(--display);font-size:12px;color:var(--btnText);background:var(--yel);padding:1px 6px}
.grph .tiny{font-weight:400}
.team button{background:var(--panel2);border:2px solid var(--edge);padding:2px;cursor:pointer}
.team canvas{width:30px;height:48px}

/* ---------- pessoas ---------- */
.person{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.portrait{width:60px;height:96px;background:linear-gradient(#323a44,#232830);border:2px solid var(--edge)}
.portrait.big{width:90px;height:144px}
.trait{display:inline-block;font-size:13px;padding:1px 7px;background:#2c2640;color:var(--purple);border:2px solid #4a3f6b}
.trait.craque{background:#3a3010;color:var(--yel);border-color:var(--yelDim)}
.lvl{font-family:var(--display);font-size:12px;color:var(--btnText);background:var(--yel);padding:1px 6px}
.lvstars{color:var(--yel);letter-spacing:1px}

/* ---------- painel ---------- */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big3 div{background:var(--panel2);border:3px solid var(--edge);padding:10px 12px}
.big3 dt{font-size:13px;color:var(--muted)}
.big3 dd{margin:0;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.big3 small{display:block;font-size:13px;color:var(--muted);font-family:var(--font)}
.hist{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:18px;border-bottom:2px solid var(--line)}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.hist .col i{display:block;width:100%;max-width:34px;background:var(--green)}
.hist .col i.neg{background:var(--red)}
.hist .col span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.histx{display:flex;gap:6px}.histx span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
details{border-top:2px dashed var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--yel);font-weight:600}
.formula{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums;margin-top:10px}
.formula .f{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}
.formula .f b{font-family:var(--display);font-size:15px;text-align:right}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.steps span{font-family:var(--display);font-size:11px;text-align:center;padding:3px 0;background:var(--panel);border:2px solid var(--line);color:var(--muted)}
.steps span.done{background:var(--green);color:#0d1a10;border-color:var(--edge)}
.steps span.now{background:var(--yel);color:var(--btnText);border-color:var(--edge)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.check li i{font-style:normal;font-weight:700}

/* ---------- troféus ---------- */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.trophy{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--panel2);border:3px solid var(--edge);padding:10px}
.trophy canvas{width:40px;height:40px}
.trophy.off{opacity:.55}
.trophy b{display:block}

/* ---------- modal e avisos ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,7,9,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.modal{align-items:center}.sheet{max-height:86vh}}
.answers{display:flex;flex-direction:column;gap:6px}
.answers button{font:inherit;font-size:15px;text-align:left;color:var(--text);background:var(--panel2);border:3px solid var(--edge);padding:9px 12px;cursor:pointer}
.answers button:hover:not(:disabled){border-color:var(--yel)}
.answers button.right{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.answers button.wrong{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.verdict{font-family:var(--display);font-size:20px}
.mhead{display:flex;gap:14px;align-items:center}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:6px;width:min(calc(100vw - 32px),460px);pointer-events:none}
.toast{background:var(--panel2);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line);padding:8px 12px;font-size:15px;animation:pop .2s steps(3)}
.toast.good{box-shadow:inset 0 0 0 2px var(--green)}.toast.bad{box-shadow:inset 0 0 0 2px var(--red)}.toast.warn{box-shadow:inset 0 0 0 2px var(--orange)}.toast.gold{box-shadow:inset 0 0 0 2px var(--yel);color:var(--yel)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:900px){.floor{grid-template-columns:1fr;justify-content:stretch}.scene{width:100%}.side{height:auto!important}.feedbox .feed{max-height:300px}.roles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (max-width:640px){
  body{font-size:16px}
  .tabs{gap:4px}
  .tabs{grid-template-columns:repeat(4,1fr);row-gap:8px}
  .tabs button{font-size:12px;padding:7px 1px 9px}
  .lvbar{width:100px}
  .portalrow{grid-template-columns:1fr}.portalrow canvas{width:64px;height:64px}
  .ctrl{margin-left:0;width:100%}
  .ctrl button{flex:1}
  .ctrl .sep{display:none}
  .grid{grid-template-columns:1fr}
  .big3 dd{font-size:20px}
  .formula .f{grid-template-columns:1fr auto}
  .formula .f .calc{grid-column:1/-1;order:3;font-size:13px;color:var(--muted)}
  .mission{flex-wrap:wrap}.mission .rw{margin-left:0}
  .scene .lab{font-size:8px}
  .scene .fl{font-size:13px}.scene .fl.big{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="page">
<header class="top">
  <div class="brandrow">
    <div><div class="brand">Golpe de Prensa</div><h1 class="plant" id="plantName">Estamparia</h1><div class="lvrow" id="lvrow"></div></div>
    <div class="clock num" data-l="clock"></div>
  </div>
  <div class="hudrow">

<script>

// ================== MOTOR DA FÁBRICA ==================
const rnd=(a,b)=>a+Math.random()*(b-a);

const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let _uid=Date.now()%100000;
const uid=()=>(++_uid).toString(36)+Math.floor(Math.random()*999).toString(36);
const DAY=1440;

const PRESSES={

const MAX_PRESSES=8;
const PARTS=[
  {id:'sup',nome:'Suporte do escapamento',t:400,preco:2.8,mat:1.9,def:0.006},
  {id:'dob',nome:'Reforço da dobradiça',t:400,preco:3.35,mat:2.3,def:0.007},

];
const CLIENTES=['Aurora Automotiva','Veloce Motors','Tauru Caminhões','Nimbus Agrícola','Orion Utilitários'];
const ROLES={
  operador:{nome:'Operador',pl:'Operadores',sal:350,desc:'Opera uma prensa. Com mais nível, trabalha em ritmo maior, gera menos defeito e percebe mais peças ruins.'},
  preparador:{nome:'Preparador',pl:'Preparadores',sal:450,desc:'Faz o setup (troca de ferramenta). Com preparador livre o setup leva de 30 a 90 min; sem ele, o operador faz sozinho em 3 h.'},
  lider:{nome:'Líder de célula',pl:'Líderes',sal:650,cob:4,desc:'Cada líder acompanha até 4 prensas: aumenta o ritmo (performance) e faz os operadores ganharem experiência mais rápido.'},
  inspetor:{nome:'Inspetor de qualidade',pl:'Inspetores',sal:480,cob:3,desc:'Cada inspetor cobre até 3 prensas e segura peças com defeito antes de saírem para o cliente. Também acelera o 8D.'},
  tecnico:{nome:'Técnico de manutenção',pl:'Técnicos',sal:550,cob:3,desc:'Cada técnico cobre até 3 prensas: faz preventiva sozinho quando a condição cai e conserta quebras mais rápido.'},
  empilhadeira:{nome:'Operador de empilhadeira',pl:'Operadores de empilhadeira',sal:400,desc:'Traz a bobina do estoque até a prensa e leva o pedido pronto até a expedição. Sem ele, o operador da prensa vai a pé buscar a bobina e entregar o pedido, e a prensa fica parada bem mais tempo.'},
  comprador:{nome:'Comprador',pl:'Compradores',sal:600,desc:'Negocia o aço mais barato, diminui atraso de fornecedor, abre o catálogo de fornecedores e encontra ofertas relâmpago.'},
  metrologista:{nome:'Metrologista',pl:'Metrologistas',sal:700,cob:99,desc:'Mantém os instrumentos calibrados e o MSA em dia. A inspeção fica mais confiável em toda a planta, e a auditoria cobra essa função.'}
};
const ROLE_ORDER=['operador','preparador','empilhadeira','lider','inspetor','tecnico','metrologista','comprador'];
// ---------- bobina, empilhadeira e expedição ----------
const COIL={p400:6000,p600:4500,p800:3000};
const coilSize=(p,S)=>(COIL[p.tipo]||3000)*(S&&S.melh&&S.melh.jumbo?1.5:1);
const WALK_COIL=60, WALK_EXP=35, THREAD=5;
const forkDur=(s,kind,S)=>(S&&S.melh&&S.melh.eletrica?0.75:1)*Math.max(5,(kind==='bobina'?11:9)*(1-0.06*(effLv(s)-1))*(s.trait==='rapido'?0.8:1));
const temEmpilhadeira=S=>S.staff.some(s=>s.role==='empilhadeira');
const custoUpPrensa=p=>Math.round(PRESSES[p.tipo].preco*0.3*(p.lv||1)/1000)*1000;
const MAX_LV_PRENSA=5;
const valorVenda=p=>{let up=0;for(let l=1;l<(p.lv||1);l++)up+=Math.round(PRESSES[p.tipo].preco*0.3*l/1000)*1000;return Math.round((PRESSES[p.tipo].preco*0.6*(0.5+0.5*p.cond/100)+up*0.5)/1000)*1000;};
const gpmEff=p=>PRESSES[p.tipo].gpm*(1+0.06*((p.lv||1)-1));
// ---------- matrizes raras ----------
const pct0=v=>Math.round(v*100)+'%';
const RARIDADES=[{n:'Comum',c:'#c3cad1',v:0.05,venda:5000},{n:'Rara',c:'#55a3e6',v:0.10,venda:15000},{n:'Épica',c:'#b98ae6',v:0.18,venda:40000},{n:'Lendária',c:'#f2c230',v:0.30,venda:100000}];
const MTIPOS={veloz:{nome:'Veloz',ef:v=>`+${pct0(v)} de cadência`},precisa:{nome:'de Precisão',ef:v=>`−${pct0(v)} de defeito`},agil:{nome:'de Troca Rápida',ef:v=>`−${pct0(v)} no tempo de setup`},robusta:{nome:'Robusta',ef:v=>`−${pct0(v)} de desgaste da prensa`}};
const LENDAS=['Fênix','Tungstênio','Trovão','Diamante','Aurora','Titã','Cometa','Dragão'];
const MAX_MATRIZES=40;
function rollRaridade(S,min){const w=[60,28,10,2+(uniDe(S)-1)*1.5];for(let i=0;i<(min||0);i++)w[i]=0;let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<4;i++){r-=w[i];if(r<=0)return i;}return 3;}
function makeMatriz(S,min){
  const r=rollRaridade(S,min),ks=Object.keys(MTIPOS),tipo=pick(ks);
  const m={id:uid(),tipo,rar:r,v:RARIDADES[r].v};
  if(r===3){m.lenda=pick(LENDAS);let t2;do{t2=pick(ks);}while(t2===tipo);m.tipo2=t2;m.v2=0.12;}
  return m;
}
const nomeMatriz=m=>m.rar===3?`Matriz ${m.lenda}`:`Matriz ${MTIPOS[m.tipo].nome}`;
const efeitoMatriz=m=>MTIPOS[m.tipo].ef(m.v)+(m.tipo2?` e ${MTIPOS[m.tipo2].ef(m.v2)}`:'');
const matrizesDe=S=>(S.meta.mats=S.meta.mats||[]);
const matrizDaPrensa=(S,p)=>p&&p.mat?matrizesDe(S).find(x=>x.id===p.mat)||null:null;
function bonusMatriz(S,p,tipo){const m=matrizDaPrensa(S,p);if(!m)return 0;return (m.tipo===tipo?m.v:0)+(m.tipo2===tipo?m.v2:0);}
function ganharMatriz(S,min,ev,origem){
  const m=makeMatriz(S,min);
  if(matrizesDe(S).length>=MAX_MATRIZES){const v=RARIDADES[m.rar].venda;S.cash+=v;ev('matriz',{m,vendida:v,origem});return m;}
  matrizesDe(S).push(m);ev('matriz',{m,origem});return m;
}
const NOMES=['João','Maria','José','Ana','Francisco','Antônia','Carlos','Francisca','Paulo','Adriana','Pedro','Juliana','Lucas','Márcia','Luiz','Fernanda','Marcos','Patrícia','Rafael','Aline','Severino','Josefa','Raimundo','Luciana','Daniel','Cícera','Tiago','Rita','Edson','Bruna','Gilberto','Sônia','Wellington','Débora','Reginaldo','Priscila'];
const SOBRE=['Silva','Santos','Oliveira','Souza','Lima','Pereira','Ferreira','Costa','Rodrigues','Almeida','Nascimento','Araújo','Barbosa','Cavalcanti','Melo'];

const partById=id=>PARTS.find(p=>p.id===id);
const MAXLV=6;
const xpNeed=lv=>Math.round(2+lv*1.5);
const TRAITS={
  rapido:{nome:'Rápido',desc:'Trabalha num ritmo acima da média.'},
  caprichoso:{nome:'Caprichoso',desc:'Quase não deixa passar defeito.'},
  incansavel:{nome:'Incansável',desc:'Aprende 50% mais rápido.'},
  craque:{nome:'Craque',desc:'Rende como se tivesse um nível a mais.'}
};
// ---------- universos e tecnologias permanentes ----------
const UNIVERSOS=['Terra','Marte','Lua de Gelo','Planeta Magma','Nebulosa Verde','Dimensão Neon','Anel de Saturno','Buraco de Minhoca'];
const nomeUni=u=>UNIVERSOS[u-1]||('Dimensão '+u);
const TECHS={
  capital:{nome:'Capital de giro',desc:'Começa cada universo com +R$ 50.000 por nível.',max:10,custo:l=>1+l},
  contrato:{nome:'Contratos premium',desc:'Clientes pagam +5% por peça, por nível.',max:10,custo:l=>1+l},
  smed:{nome:'Troca rápida (SMED)',desc:'Setup 10% mais rápido por nível.',max:5,custo:l=>1+l},
  fama:{nome:'Fama de mercado',desc:'Começa com +10 de reputação por nível (meia estrela).',max:5,custo:l=>1+l},
  aco:{nome:'Aço de primeira',desc:'Peças geram 8% menos defeito por nível.',max:5,custo:l=>2+l},
  preditiva:{nome:'Manutenção preditiva',desc:'Prensas quebram 10% menos por nível.',max:5,custo:l=>2+l},
  olheiro:{nome:'Olheiro de talentos',desc:'+5% de chance de aparecer Craque no RH, por nível.',max:4,custo:l=>2+l},
  escola:{nome:'Escola técnica',desc:'Todo mundo contratado já chega com +1 nível, por nível.',max:3,custo:l=>[2,5,9][l]},
  noturno:{nome:'Turno da noite',desc:'A fábrica produz por mais 2 h enquanto você está fora, por nível (começa com 4 h).',max:4,custo:l=>2+l},
  galpao:{nome:'Galpão equipado',desc:'Começa com prensas extras já com operador: nível 1 ganha uma de 400 t, nível 2 uma de 600 t, nível 3 uma de 800 t.',max:3,custo:l=>[3,6,10][l]}
};
const TECH_ORDER=['capital','contrato','smed','fama','aco','preditiva','olheiro','escola','noturno','galpao'];
const NIVEL_SALTO=10, LVK=25000;
const tec=(S,k)=>(S&&S.meta&&S.meta.ups&&S.meta.ups[k])||0;
const uniDe=S=>(S&&S.meta&&S.meta.uni)||1;
const nivelDe=rec=>1+Math.floor(Math.sqrt(Math.max(0,rec)/LVK));
const recDoNivel=n=>LVK*(n-1)*(n-1);
const nivelSalto=S=>NIVEL_SALTO+2*(uniDe(S)-1);
const patentesPara=S=>{const n=nivelDe(S.tot.receita||0);return n>=nivelSalto(S)?Math.floor((n-1)*(1+0.25*(uniDe(S)-1))):0;};
function rollTrait(S){const r=Math.random(),c=0.1+0.05*tec(S,'olheiro');return r<c?'craque':r<c+0.3?'rapido':r<c+0.6?'caprichoso':'incansavel';}
function makeStaff(role,lv,S){return {id:uid(),nome:pick(NOMES)+' '+pick(SOBRE),role,lv:Math.min(MAXLV,lv+tec(S,'escola')),xp:0,trait:rollTrait(S),look:{sk:rint(0,4),hc:rint(0,5),hs:rint(0,3)}};}
function effLv(s){let l=s.lv+(s.trait==='craque'?1:0);if(s.role!=='operador'&&s.role!=='preparador'&&(s.trait==='rapido'||s.trait==='caprichoso'))l+=(s.trait==='caprichoso'&&s.role==='inspetor')?1:0.5;return l;}
const salario=s=>Math.round(ROLES[s.role].sal*(1+0.25*(s.lv-1)));
const admissao=s=>salario(s)*3;
const rescisao=s=>salario(s)*5;
const trainCost=s=>Math.round(1500*s.lv);

// ---------- efeitos da equipe ----------
function roleInfo(S,role){
  const ms=S.staff.filter(s=>s.role===role);
  const n=S.press.length||1, cob=ROLES[role].cob||1;
  const lv=ms.length?ms.reduce((a,s)=>a+effLv(s),0)/ms.length:0;
  const cov=role==='metrologista'?(ms.length?1:0):Math.min(1,ms.length*cob/n);
  return {n:ms.length,lv,cov};
}
function effects(S){
  const L=roleInfo(S,'lider'),I=roleInfo(S,'inspetor'),T=roleInfo(S,'tecnico'),M=roleInfo(S,'metrologista');
  const metro=M.n?0.06+0.015*M.lv:0;
  return {
    lead:L.cov*(0.03+0.012*L.lv), leadXp:L.cov*0.6,
    insp:I.n?I.cov*Math.min(0.94,0.5+0.06*I.lv+metro):0,
    tecCov:T.cov, tecLv:T.lv, L,I,T,M
  };
}
const opPerf=lv=>Math.min(0.95,0.66+0.045*(lv-1));
const opDet=lv=>0.4+0.05*(lv-1);
const opDefMult=lv=>1.2-0.06*(lv-1);
const condDefMult=c=>1+(100-c)/60;
const hazard=(c,S)=>(1/5000)*(1+Math.pow((100-c)/25,2))*(1-0.1*tec(S,'preditiva'))*(1+0.1*(uniDe(S)-1));

function newDay(){return {plan:0,run:0,prod:0,ideal:0,def:0,scrap:0,esc:0,brk:0,loss:{setup:0,brk:0,mat:0,log:0,pm:0,noop:0}};}

function makeOrder(S,forceT){
  const maxT=Math.max(400,...S.press.map(p=>PRESSES[p.tipo].t));
  const tons=[400,600,800].filter(t=>t<=Math.min(800,maxT+200));
  const t=forceT||pick(tons);
  const part=pick(PARTS.filter(p=>p.t===t));
  const rate=PRESSES['p'+t].gpm*0.6*DAY;
  const rep=S.rep;
  const ppm=pick(rep<25?[5000,3000]:rep<50?[3000,1500]:rep<75?[1500,800]:[800,400]);
  const pm={5000:0.96,3000:1,1500:1.06,800:1.12,400:1.2}[ppm];
  const qtd=Math.max(2000,Math.round(rate*rnd(0.35,1.1)/500)*500);
  const dias=Math.max(1,Math.ceil(qtd/rate*1.7+0.4));
  return {id:uid(),cli:pick(CLIENTES),part:part.id,qtd,preco:+(part.preco*pm*(1+S.rep/500)*(1+0.05*tec(S,'contrato'))*(1+0.15*(uniDe(S)-1))).toFixed(2),ppm,dias,st:'oferta',exp:S.t+2*DAY,good:0,esc:0,scrap:0,press:null,due:null};
}

// ---------- simulação de uma prensa ----------
function stepPress(S,p,dt,E,ev){
  let guard=0;
  while(dt>1e-6&&guard++<8){
    const o=p.ped?S.orders.find(x=>x.id===p.ped):null;
    const d=p.day;
    if(p.st==='nomat'&&p.rem==null){if(o){d.plan+=dt;d.loss.mat+=dt;}return;}
    if(['setup','broken','pm','nomat','exped'].includes(p.st)){
      const use=Math.min(dt,p.rem); p.rem-=use; dt-=use;
      if(o){d.plan+=use; d.loss[{setup:'setup',broken:'brk',pm:'pm',nomat:'mat',exped:'log'}[p.st]]=(d.loss[{setup:'setup',broken:'brk',pm:'pm',nomat:'mat',exped:'log'}[p.st]]||0)+use;}
      if(p.rem<=1e-6){
        if(p.st==='nomat'){if(p.coilPending){p.coil=coilSize(p,S);p.coilPending=false;ev('bobina_fim',{p,walk:p.walk});}p.walk=false;p.atraso=false;}
        if(p.st==='exped'){const eo=p.expOrder;p.expOrder=null;if(eo)deliver(S,eo,ev);}
        if(p.st==='setup'){p.part=p.setupPart; if(p.prep){S.prepBusy=S.prepBusy.filter(x=>x!==p.prep);p.prep=null;} ev('setup_fim',{p});}
        if(p.st==='pm'){p.cond=100;p.tec=null;ev('pm_fim',{p});}
        if(p.st==='broken'){p.cond=Math.max(p.cond,75);p.tec=null;ev('reparo_fim',{p});}
        p.st='idle';
      }
      continue;
    }
    if(!o){p.st='idle';return;}
    const op=p.op?S.staff.find(s=>s.id===p.op):null;
    if(!op){p.st='noop';d.plan+=dt;d.loss.noop+=dt;return;}
    if(p.part!==o.part){
      const free=S.staff.filter(s=>s.role==='preparador'&&!S.prepBusy.includes(s.id)).sort((a,b)=>b.lv-a.lv)[0];
      if(free){p.prep=free.id;S.prepBusy.push(free.id);p.rem=Math.max(25,90-12*(effLv(free)-1)-(free.trait==='rapido'?15:0));}
      else{p.prep=null;p.rem=180;}
      p.rem*=(1-0.1*tec(S,'smed'))*(1-bonusMatriz(S,p,'agil'))*(melh(S,'ponte')?0.85:1);
      p.st='setup';p.setupPart=o.part;p.setupTot=p.rem;
      continue;
    }
    // preventiva automática com técnico
    if(p.cond<55&&E.tecCov>0&&Math.random()<E.tecCov*dt/15){
      p.st='pm';p.rem=Math.max(30,60-6*(E.tecLv-1));p.remTot=p.rem;p.tec=freeTec(S);ev('pm',{p,auto:true});continue;
    }
    // quebra
    if(Math.random()<hazard(p.cond,S)*dt){
      const withTec=Math.random()<E.tecCov;
      p.st='broken';p.rem=withTec?Math.max(60,150-15*(E.tecLv-1)):480;p.remTot=p.rem;
      const custo=withTec?2000:8000; S.cash-=custo; p.tec=withTec?freeTec(S):null;
      d.brk++;S.tot.brk++;ev('quebra',{p,withTec,custo});continue;
    }
    p.st='run';
    const part=partById(o.part);
    const ol=effLv(op), cap=op.trait==='caprichoso';
    const perf=Math.min(0.98,opPerf(ol)+E.lead+(op.trait==='rapido'?0.05:0));
    const nominal=gpmEff(p)*(1+bonusMatriz(S,p,'veloz'));
    const prod=nominal*perf*dt;
    const defRate=S.def[o.part]*opDefMult(ol)*condDefMult(p.cond)*(cap?0.8:1)*(1-bonusMatriz(S,p,'precisa'));
    const gen=prod*defRate;
    const det=1-(1-Math.min(0.9,opDet(ol)+(cap?0.05:0)))*(1-E.insp)*(melh(S,'camera')?0.7:1);
    const scrap=gen*det, esc=gen-scrap;
    o.good+=prod-scrap;o.esc+=esc;o.scrap+=scrap;
    S.cash-=prod*part.mat*fatorAco(S);
    p.cond=Math.max(0,p.cond-dt/40*(1-0.05*((p.lv||1)-1))*(1-bonusMatriz(S,p,'robusta'))*(melh(S,'lubri')?0.85:1));
    d.plan+=dt;d.run+=dt;d.prod+=prod;d.ideal+=nominal*dt;d.def+=gen;d.scrap+=scrap;d.esc+=esc;
    S.tot.prod+=prod;
    p.coil=(p.coil??coilSize(p,S))-prod;
    if(o.good>=o.qtd) finishOrder(S,p,o,ev);
    if(p.coil<=0&&p.st!=='exped'){p.coil=0;requestCoil(S,p,ev);}
    return;
  }
}
function requestCoil(S,p,ev){
  p.st='nomat';p.coilPending=true;
  if(temEmpilhadeira(S)){p.rem=null;p.remTot=0;p.walk=false;S.ftasks=S.ftasks||[];S.ftasks.push({kind:'bobina',press:p.id});}
  else{p.walk=true;p.rem=WALK_COIL;p.remTot=p.rem;}
  ev('bobina_pedido',{p,walk:p.walk});
}
function finishOrder(S,p,o,ev){
  p.ped=null;o.press=null;
  S.orders=S.orders.filter(x=>x!==o);
  if(temEmpilhadeira(S)){S.ftasks=S.ftasks||[];S.ftasks.push({kind:'exped',order:o,press:p.id});ev('pronto',{o,p,fork:true});}
  else{p.st='exped';p.rem=WALK_EXP;p.remTot=p.rem;p.expOrder=o;ev('pronto',{o,p,fork:false});}
  autoAssign(S);
}
function deliver(S,o,ev){
  const late=S.t>o.due;
  const ppm=o.esc/o.qtd*1e6;
  const receita=o.qtd*o.preco*(late?(o.esp?0.36:0.9):1);
  S.cash+=receita;S.tot.receita=(S.tot.receita||0)+receita;
  const comp=ppm>o.ppm;
  let custoRec=0;
  if(comp){custoRec=Math.round(3000+o.esc*o.preco*2);S.cash-=custoRec;S.rep=clamp(S.rep-6,0,100);
    S.comps.push({id:uid(),cli:o.cli,part:o.part,ppm,ppmMax:o.ppm,dia:dayOf(S.t),st:'aberta',ini:null,fim:null});}

function stepForks(S,dt,ev){
  S.ftasks=S.ftasks||[];S.fbusy=S.fbusy||{};
  const forks=S.staff.filter(s=>s.role==='empilhadeira');
  for(const sid in S.fbusy)if(!forks.some(f=>f.id===sid)){S.ftasks.unshift(S.fbusy[sid].task);delete S.fbusy[sid];}
  S.ftasks=S.ftasks.filter(t=>t.kind==='exped'||S.press.some(p=>p.id===t.press));
  if(!forks.length){
    for(const t of S.ftasks){
      if(t.kind==='bobina'){const p=S.press.find(x=>x.id===t.press);if(p&&p.st==='nomat'&&p.rem==null){p.walk=true;p.rem=WALK_COIL;p.remTot=p.rem;}}
      else deliver(S,t.order,ev);
    }
    S.ftasks=[];return;
  }
  S.ftasks.sort((a,b)=>(a.kind==='bobina'?0:1)-(b.kind==='bobina'?0:1));
  for(const f of forks){if(S.fbusy[f.id]||!S.ftasks.length)continue;const task=S.ftasks.shift();const d=forkDur(f,task.kind,S);S.fbusy[f.id]={task,rem:d,tot:d};}
  for(const sid in S.fbusy){
    const b=S.fbusy[sid];b.rem-=dt;
    if(b.rem<=0){
      delete S.fbusy[sid];const t=b.task;
      if(t.kind==='bobina'){const p=S.press.find(x=>x.id===t.press);if(p&&p.st==='nomat'&&p.rem==null){p.rem=THREAD;p.remTot=THREAD;}}
      else deliver(S,t.order,ev);
    }
  }
}

  if(p.prep)S.prepBusy=S.prepBusy.filter(x=>x!==p.prep);

function autoAssign(S){

function simOffline(S,segundos){
  const limite=horasOffline(S)*3600;
  const seg=Math.min(segundos,limite);
  const minutos=seg*OFF_RATE;
  const R={segFora:segundos,segUsados:0,limitado:segundos>limite,receita:0,ped:0,comp:0,brk:0,ups:[],mats:[],dias:0,auto:0,motivo:null,cash0:S.cash,rec0:S.tot.receita||0};
  const ev=(k,d)=>{

    else if(k==='quebra')R.brk++;
    else if(k==='matriz')R.mats.push(d.m);
    else if(k==='auto')R.auto++;
    else if(k==='dia'){R.dias++;R.ups.push(...d.ups);const last=S.days[S.days.length-1];if(last)last.lucro=d.lucro;if(dayOf(S.t)>=S.nextAud)S.audPending=true;}
  };
  let t=0;
  while(t<minutos){
    simStep(S,2,ev);t+=2;
    if(S.audPending){R.motivo='auditoria';break;}
    if(S.cash<-80000){R.motivo='caixa';break;}
    if(t%30===0&&fabricaParada(S)){R.motivo='sem_pedidos';break;}
  }
  R.segUsados=t/OFF_RATE;R.minJogo=t;
  return R;
}

const Scene={ents:{},parts:[],trucks:[],wander:{},shakeT:0};
const slotXY=i=>{const col=i%SC.COLS,row=Math.floor(i/SC.COLS);return {x0:4+col*SC.CELL,y0:SC.TOP+row*(SC.ROWH+SC.AISLE),row};};
const walkY=row=>row>=2?SC.DOCK+17:SC.TOP+row*(SC.ROWH+SC.AISLE)+SC.ROWH+9;
const rowOfY=y=>y>=SC.DOCK?2:Math.min(1,Math.floor((y-SC.TOP-1)/(SC.ROWH+SC.AISLE)));
const IDLE={operador:[10,20,30,40],preparador:[52,60],tecnico:[70,78],lider:[88],inspetor:[96,104],metrologista:[112],comprador:[124]};
function idleSpot(s,i){const a=IDLE[s.role]||[20];return {x:a[i%a.length]+(Math.floor(i/a.length)*5)%12,y:SC.DOCK+22};}
const forkPark=i=>({x:34+i*16,y:SC.DOCK+12});
function targetFor(s,idx,now){
  if(s.role==='empilhadeira'){
    const b=(S.fbusy||{})[s.id];
    if(b){
      const ph=1-b.rem/Math.max(0.01,b.tot),k=S.press.findIndex(p=>p.id===b.task.press);
      const frente=()=>{const {x0,y0}=slotXY(k);return {x:x0+30,y:y0+SC.ROWH+8};};
      if(b.task.kind==='bobina')return ph<0.6&&k>=0?{...frente(),carry:'coil'}:{...forkPark(idx),carry:null};
      return ph<0.45&&k>=0?{...frente(),carry:null}:{x:DOCKX-8,y:SC.DOCK+20,carry:'pallet'};
    }
    return {...forkPark(idx),idle:1};
  }
  const pi=S.press.findIndex(p=>p.op===s.id);
  if(s.role==='operador'){if(pi>=0){const {x0,y0}=slotXY(pi);return {x:x0+3,y:y0+SC.ROWH-2,work:S.press[pi].st==='run',face:1,at:pi};}return {...idleSpot(s,idx),idle:1};}
  if(s.role==='preparador'){const k=S.press.findIndex(p=>p.prep===s.id&&p.st==='setup');if(k>=0){const {x0,y0}=slotXY(k);return {x:x0+17,y:y0+SC.ROWH+8,work:1,at:k};}return {...idleSpot(s,idx),idle:1};}
  if(s.role==='tecnico'){const k=S.press.findIndex(p=>p.tec===s.id&&(p.st==='broken'||p.st==='pm'));if(k>=0){const {x0,y0}=slotXY(k);return {x:x0+22,y:y0+SC.ROWH+8,work:1,at:k};}return {...idleSpot(s,idx),idle:1};}
  // patrulha
  let w=Scene.wander[s.id];
  const stayHome=(s.role==='metrologista'||s.role==='comprador')?0.6:0.1;
  if(!w||now>w.until){
    if(!S.press.length||Math.random()<stayHome){w={...idleSpot(s,idx),until:now+rnd(4000,9000)};}
    else{const k=rint(0,S.press.length-1);const {x0,y0}=slotXY(k);w={x:x0+rint(10,30),y:y0+SC.ROWH+8,until:now+rnd(5000,10000),at:k,look:1};}
    Scene.wander[s.id]=w;
  }
  return w;
}
function pathTo(e,t){
  const r0=rowOfY(e.y), r1=rowOfY(t.y);
  const pts=[];
  const wy0=walkY(r0), wy1=walkY(r1);
  if(Math.abs(e.y-wy0)>0.5)pts.push({x:e.x,y:wy0});
  if(r0!==r1){const corr=[0,44,88,132,176].reduce((b,c)=>Math.abs(c-(e.x+t.x)/2)<Math.abs(b-(e.x+t.x)/2)?c:b,0)+1;pts.push({x:corr,y:wy0});pts.push({x:corr,y:wy1});}
  pts.push({x:t.x,y:wy1});
  pts.push({x:t.x,y:t.y});
  return pts;
}
function sceneUpdate(now,dt){
  const seen={};
  const byRole={};
  S.staff.forEach(s=>{
    const idx=(byRole[s.role]=(byRole[s.role]||0)+1)-1;
    seen[s.id]=1;
    let e=Scene.ents[s.id];
    const t=targetFor(s,idx,now);
    if(!e){const sp=idleSpot(s,idx);e=Scene.ents[s.id]={x:SC.W-6,y:SC.DOCK+22,path:[],tx:null,ty:null,face:-1,ph:Math.random()*1000};if(!t.idle){e.x=t.x;e.y=t.y;}}
    if(e.tx!==t.x||e.ty!==t.y){e.tx=t.x;e.ty=t.y;e.path=pathTo(e,t);}
    e.tgt=t;
    const sp=24*(S.speed>=3?1.6:1)*(s.role==='empilhadeira'?2.4*Math.max(1,S.speed/1.2):1)*dt;
    let rem=sp;
    while(rem>0&&e.path.length){
      const q=e.path[0];const dx=q.x-e.x,dy=q.y-e.y;const d=Math.hypot(dx,dy);
      if(d<=rem){e.x=q.x;e.y=q.y;e.path.shift();rem-=d;}
      else{e.x+=dx/d*rem;e.y+=dy/d*rem;rem=0;if(Math.abs(dx)>0.1)e.face=dx>0?1:-1;}
    }
    e.walking=e.path.length>0;
    if(!e.walking&&t.face)e.face=t.face;
  });
  for(const id in Scene.ents)if(!seen[id])delete Scene.ents[id];
  Scene.parts=Scene.parts.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;return p.life>0;});
  Scene.trucks=Scene.trucks.filter(tr=>{tr.t+=dt;return tr.t<5;});
}

function showAudit(){
  S.qAsked=S.qAsked||[];
  let pool=QUIZ.map((q,i)=>i).filter(i=>!S.qAsked.includes(i));if(!pool.length){S.qAsked=[];pool=QUIZ.map((q,i)=>i);}
  const qi=pick(pool);S.qAsked.push(qi);
  audit={checks:auditChecks(),qi,ans:shuffle(QUIZ[qi].a.map((t,i)=>({t,right:i===0}))),picked:null};
  snd('warn');renderAudit();
}
function renderAudit(){
  const q=QUIZ[audit.qi],a=audit;
  const ck=a.checks.map(c=>`<li><i class="${c.ok?'good':'bad'}">${c.ok?'✓':'✗'}</i><div>${c.t}</div></li>`).join('');
  let res='';
  if(a.picked!==null){
    const right=a.ans[a.picked].right;
    const pts=a.checks.filter(c=>c.ok).length+(right?1:0);
    const v=pts>=5?{t:'Aprovado!',c:'good',d:'O cliente ficou feliz: +1 estrela de reputação e R$ 20.000 de bônus.'}:pts>=3?{t:'Passou raspando',c:'warn',d:'Nada de bônus desta vez. Resolva os itens com ✗ até a próxima visita.'}:{t:'Reprovado',c:'bad',d:'Perdeu 2 estrelas de reputação e pagou R$ 15.000 de reauditoria.'};
    res=`<p class="tiny">${right?'Acertou!':'Errou.'} ${q.e}</p><div class="verdict ${v.c}">${v.t} ${pts} de 6</div><p class="muted">${v.d}</p>
      <button class="btn wide" data-act="auditEnd" data-arg="${pts}">Voltar para a fábrica</button>`;
  }
  openModal(`<div class="brand">Dia ${dayOf(S.t)}</div><h2>Visita do auditor!</h2>
    <p class="muted">Ele confere 5 coisas na fábrica e faz uma pergunta. Com 5 pontos de 6, você passa.</p>
    <ul class="check">${ck}</ul>
    <h3>Pergunta valendo 1 ponto</h3><p>${q.q}</p>
    <div class="answers">${a.ans.map((x,i)=>`<button data-act="auditAns" data-arg="${i}" ${a.picked!==null?'disabled':''} class="${a.picked!==null?(x.right?'right':(i===a.picked?'wrong':'')):''}">${x.t}</button>`).join('')}</div>${res}`,'audit');
}

function drawPart(c,id){

    col:()=>{F(6,1,4,14,m);F(6,1,1,14,h);F(9,1,1,14,s);F(7,4,1,2,k);F(7,10,1,2,k);},

const ST_TXT={run:'Produzindo',setup:'Trocando ferramenta',broken:'Quebrada!',pm:'Em revisão',nomat:'Sem bobina',exped:'Operador levando o pedido para a expedição',noop:'Sem operador!',idle:'Parada, sem pedido'};
function pressState(p){
  let t=ST_TXT[p.st]||p.st;
  if(p.st==='nomat'){
    if(p.rem==null)return 'Esperando a empilhadeira trazer bobina';
    if(p.atraso)return `Fornecedor atrasou a bobina, volta em ${dur(p.rem)}`;
    if(p.walk)return `Operador foi a pé buscar bobina, volta em ${dur(p.rem)}`;
    return `Colocando bobina nova, volta em ${dur(p.rem)}`;
  }
  if(['setup','broken','pm','exped'].includes(p.st))t+=`, volta em ${dur(p.rem)}`;
  if(p.st==='setup'&&!p.prep)t+=' (sem preparador, demora mais)';
  return t;
}
function todayAgg(){const a=newDay();for(const p of S.press){for(const k of ['plan','run','prod','ideal','def','scrap','esc','brk'])a[k]+=p.day[k];for(const k in a.loss)a.loss[k]+=p.day.loss[k];}return a;}
function live(k){
  const [a,id]=k.split(':');
  switch(a){
    case 'clock':return `Dia ${dayOf(S.t)}, ${hhmm(S.t)}`;
    case 'cash':return brl(S.cash);
    case 'oferta':return S.oferta&&S.t<S.oferta.ate?`Some em ${dur(S.oferta.ate-S.t)}`:'Oferta encerrada';
    case 'promo':return S.acoPromo&&S.t<S.acoPromo.ate?`termina em ${dur(S.acoPromo.ate-S.t)}`:'encerrado';
    case 'lvnext':{const n=nivelDe(S.tot.receita||0);return `faltam ${brl(recDoNivel(n+1)-(S.tot.receita||0))} de faturamento para o nível ${n+1}`;}
    case 'pst':{const p=pressById(id);return p?pressState(p):'';}
    case 'pcond':{const p=pressById(id);return p?`${Math.round(p.cond)}%`:'';}
    case 'pcoil':{const p=pressById(id);return p?`dá para mais ${num(Math.max(0,p.coil??coilSize(p,S)))} peças`:'';}
    case 'oprog':{const o=orderById(id);return o?`${num(Math.min(o.good,o.qtd))} de ${num(o.qtd)} peças`:'';}
    case 'oppm':{const o=orderById(id);if(!o)return '';return o.good>0?`Peças ruins até agora: ${num(o.esc/Math.max(1,o.good)*1e6)} PPM (cliente aceita ${num(o.ppm)})`:`Cliente aceita até ${num(o.ppm)} PPM`;}
    case 'odue':{const o=orderById(id);if(!o)return '';const r=o.due-S.t;return r>=0?`Entrega em ${dur(r)}`:`Atrasado ${dur(-r)}`;}
    case '8d':{const c=S.comps.find(x=>x.id===id);if(!c||c.st!=='8d')return '';return `Resolve em ${dur(c.fim-S.t)}`;}
  }
  return '';
}
function liveW(k){
  const [a,id]=k.split(':');
  if(a==='pcond'){const p=pressById(id);return p?p.cond:0;}
  if(a==='pcoil'){const p=pressById(id);return p?Math.max(0,(p.coil??coilSize(p,S)))/coilSize(p,S)*100:0;}
  if(a==='lvl'){const n=nivelDe(S.tot.receita||0),a0=recDoNivel(n),a1=recDoNivel(n+1);return ((S.tot.receita||0)-a0)/(a1-a0)*100;}
  if(a==='oprog'){const o=orderById(id);return o?Math.min(100,o.good/o.qtd*100):0;}
  return 0;
}
function liveCls(k){
  const [a,id]=k.split(':');
  if(a==='oppm'){const o=orderById(id);if(!o||o.good<=0)return '';return o.esc/o.good*1e6>o.ppm?'bad':'good';}
  if(a==='odue'){const o=orderById(id);if(!o)return '';const r=o.due-S.t;return r<0?'bad':r<DAY/2?'warn':'';}
  if(a==='pst'){const p=pressById(id);return p?'state '+({run:'good',setup:'gold',pm:'info',broken:'bad',noop:'bad',nomat:'warn',exped:'warn',idle:'muted'}[p.st]||''):'';}
  if(a==='cash')return 'cash num'+(S.cash<0?' neg':'');
  return null;
}
const L=(key,base='')=>`<span data-l="${key}" class="${base}"></span>`;
function updateLive(){
  if(!S)return;
  document.querySelectorAll('[data-l]').forEach(el=>{const k=el.dataset.l;const v=live(k);if(el.textContent!==v)el.textContent=v;const c=liveCls(k);if(c!==null&&el.className!==c)el.className=c;});
  document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=clamp(liveW(el.dataset.w),0,100)+'%';});
  document.querySelectorAll('[data-cost]').forEach(b=>{if(!b.hasAttribute('data-lock'))b.disabled=S.cash<+b.dataset.cost;});
  $('#stars').innerHTML=stars(S.rep);
  document.querySelectorAll('canvas[data-part]').forEach(c=>{if(!c.dataset.done){drawPart(c,c.dataset.part);c.dataset.done=1;}});
  document.querySelectorAll('canvas[data-trophy]').forEach(c=>{if(!c.dataset.done){drawTrophy(c,c.dataset.trophy==='1');c.dataset.done=1;}});
}

  const parts=[tab,P,S.orders.map(o=>o.id+(o.press||'')).join(','),S.board.map(o=>o.id).join(','),S.staff.map(s=>s.id+s.lv).join(','),S.comps.map(c=>c.id+c.st).join(','),S.days.length,S.mis,S.hist.length,S.speed,(S.tro||[]).length];
  if(tab==='fabrica')parts.push(S.log.length?S.log[0].t+S.log[0].txt:'');
  if(tab==='equipe')parts.push(S.cands.map(c=>c.id).join(','));
  if(tab==='painel')parts.push(S.comps.some(c=>c.st==='8d')?Math.floor(S.t/60):0);
  if(tab==='compras')parts.push(S.oferta?S.oferta.ate:0,JSON.stringify(S.melh||{}),compradorLv(S),acoPromo(S)>0,S.press.length,S.staff.filter(x=>x.role==='comprador').length);
  parts.push(!!(S.oferta&&S.t<S.oferta.ate));
  if(tab==='ranking')parts.push(RK.quando,RK.erro,RK.carregando,JOG.apelido,RK.trocando);

}

function vPainel(){
  const y=S.days[S.days.length-1],o=OEE(y);
  const l5=S.hist.slice(-5),q=l5.reduce((a,h)=>a+h.qtd,0),e=l5.reduce((a,h)=>a+h.esc,0);
  const l10=S.hist.slice(-10),otd=l10.length?l10.filter(h=>!h.late).length/l10.length:null;
  const big=`<dl class="big3"><div><dt>OEE de ontem</dt><dd class="${o?(o.v>=0.65?'good':o.v<0.4?'bad':''):''}">${o?pct(o.v):'–'}</dd><small>quanto da fábrica virou peça boa</small></div>
    <div><dt>PPM</dt><dd class="${q?(e/q*1e6>3000?'bad':'good'):''}">${q?num(e/q*1e6):'–'}</dd><small>peças ruins por milhão, últimas 5 entregas</small></div>
    <div><dt>No prazo</dt><dd class="${otd===null?'':otd>=0.9?'good':'warn'}">${otd===null?'–':pct(otd)}</dd><small>das últimas 10 entregas</small></div></dl>`;
  const days=S.days.slice(-10);
  const mx=Math.max(1,...days.map(d=>Math.abs(d.lucro||0)));
  const hist=days.length?`<div class="hist">${days.map(x=>{const v=x.lucro||0;return `<div class="col"><span>${v>=0?'':'−'}${Math.abs(v)>=1000?Math.round(Math.abs(v)/1000)+' mil':num(Math.abs(v))}</span><i class="${v<0?'neg':''}" style="height:${Math.max(2,Math.abs(v)/mx*100)}%"></i></div>`;}).join('')}</div><div class="histx">${days.map(x=>`<span>D${x.d}</span>`).join('')}</div>`:'<p class="empty">O gráfico aparece quando o primeiro dia fechar.</p>';
  const hasI=S.staff.some(s=>s.role==='inspetor');
  const D8=['D1','D2','D3','D4','D5','D6','D7','D8'];
  const comps=S.comps.slice().reverse().filter((c,i)=>c.st!=='fechada'||i<4).map(c=>{
    let steps='',act='';
    if(c.st==='aberta')act=`<button class="btn" data-act="open8d" data-arg="${c.id}" data-cost="${COST_8D}">Resolver com 8D ${brl(COST_8D)}</button><span class="tiny">${hasI?'Leva 1 dia.':'Sem inspetor, leva 2 dias.'}</span>`;
    else{const f=c.st==='fechada'?1:clamp((S.t-c.ini)/(c.fim-c.ini),0,1);const cur=Math.min(7,Math.floor(f*8));
      steps=`<div class="steps">${D8.map((x,i)=>`<span class="${c.st==='fechada'||i<cur?'done':i===cur?'now':''}">${x}</span>`).join('')}</div>`;
      act=c.st==='fechada'?'<span class="tiny good">Resolvido. A peça agora sai melhor.</span>':L('8d:'+c.id,'tiny');}
    return `<div class="card"><div class="row between wrap"><b>${esc(c.cli)}</b><span class="pill ${c.st==='fechada'?'good':c.st==='aberta'?'bad':'warn'}">${c.st==='fechada'?'Resolvida':c.st==='aberta'?'Aberta':'Em andamento'}</span></div>
      <div class="tiny">Dia ${c.dia}: ${partById(c.part).nome.toLowerCase()} chegou com ${num(c.ppm)} PPM, e o limite era ${num(c.ppmMax)}.</div>${steps}<div class="row wrap">${act}</div></div>`;}).join('');
  const ck=auditChecks().map(c=>`<li><i class="${c.ok?'good':'bad'}">${c.ok?'✓':'✗'}</i><div>${c.t}</div></li>`).join('');
  const dA=S.nextAud-dayOf(S.t);
  const f=o?`<div class="formula">
    <div class="f"><span>Disponibilidade</span><span class="calc tiny">tempo produzindo ÷ tempo com pedido = ${hrs(y.run)} ÷ ${hrs(y.plan)}</span><b>${pct(o.A)}</b></div>
    <div class="f"><span>Performance</span><span class="calc tiny">peças feitas ÷ o máximo possível = ${num(y.prod)} ÷ ${num(y.ideal)}</span><b>${pct(o.P)}</b></div>
    <div class="f"><span>Qualidade</span><span class="calc tiny">peças boas ÷ peças feitas</span><b>${pct(o.Q)}</b></div>
    <div class="f"><span>OEE</span><span class="calc tiny">os três multiplicados</span><b class="gold">${pct(o.v)}</b></div></div>`:'<p class="tiny">Disponível depois do primeiro dia.</p>';
  return `<section class="panel"><h2>Como a fábrica está indo</h2>${big}
    <h3>Lucro por dia</h3>${hist}
    <details><summary>Como o OEE é calculado?</summary>${f}<p class="tiny" style="margin-top:8px">PPM = peças ruins que chegaram no cliente ÷ peças entregues × 1.000.000.</p></details></section>
  <section class="panel"><h2>Reclamações</h2>
    ${comps?`<div class="grid">${comps}</div>`:'<p class="empty">Nenhuma reclamação. Os clientes estão felizes!</p>'}</section>
  <section class="panel"><div class="phead"><h2>Visita do auditor</h2><span class="tiny">${dA<=0?'Hoje':dA===1?'Amanhã':`Em ${dA} dias`}</span></div>
    <p class="muted">Como estaria se ele chegasse agora:</p><ul class="check">${ck}</ul></section>`;
}

function drawPortal(now){

      if(k==='aco')for(const p of PARTS)S.def[p.id]*=(1-0.08*tec(S,'aco'))/(1-0.08*(tec(S,'aco')-1));
      snd('buy');toast(`${TECHS[k].nome} agora no nível ${tec(S,k)}.`,'good');log(`Tecnologia comprada: ${TECHS[k].nome}, nível ${tec(S,k)}.`,'gold');}},
  salto:()=>{const g=patentesPara(S);if(!g)return;const u=uniDe(S)+1;
    openModal(`<h2>Saltar para o Universo ${u}: ${nomeUni(u)}?</h2>
      <p class="muted">A fábrica atual fica para trás: prensas, equipe, caixa, pedidos e reputação. Você leva <b class="gold">${g} patentes</b>, as tecnologias, os troféus e o faturamento do ranking.</p>
      <p class="tiny">${nomeUni(u)} paga 15% a mais por peça do que ${nomeUni(u-1)}, mas é um pouco mais difícil. O próximo salto pede nível ${nivelSalto(S)+2}.</p>
      <div class="row wrap"><button class="btn" data-act="saltoYes">Abrir o portal</button><button class="btn ghost" data-act="close">Ainda não</button></div>`,'confirm');},
  saltoYes:()=>{const r=saltarUniverso(S);if(!r)return closeModal();
    closeModal();portalAnim();snd('trophy');
    S=r.N;Scene.ents={};Scene.trucks=[];Scene.parts=[];RK.ultimoEnvio=0;
    log(`Bem-vindo ao Universo ${uniDe(S)}: ${nomeUni(uniDe(S))}! Você trouxe ${r.ganho} patentes.`,'gold');
    tab='progresso';sig='';save();enviarRanking(true);
    setTimeout(()=>{openModal(`<div class="brand">Universo ${uniDe(S)}</div><h2>Bem-vindo a ${nomeUni(uniDe(S))}!</h2>
      <p class="muted">Você chegou com <b class="gold">${S.meta.pat} ${S.meta.pat===1?'patente':'patentes'}</b> para gastar em tecnologias. Elas valem para sempre. Depois, é só reconstruir a fábrica, agora mais forte.</p>
      <button class="btn wide" data-act="close">Ver tecnologias</button>`,'help');},RM?60:1500);},
  joinRank:()=>{const v=limparApelido($('#apelidoInput').value);if(!v){toast('Escreva um nome para aparecer no ranking.','warn');return;}
    JOG.apelido=v;saveJog();RK.trocando=false;toast('Nome salvo no ranking!','good');
    enviarRanking(true).then(ok=>{if(!ok)toast('Não consegui enviar sua pontuação agora. Tento de novo sozinho.','warn');RK.quando=0;carregarRanking();});},
  trocarApelido:()=>{RK.trocando=true;},
  cancelApelido:()=>{RK.trocando=false;},
  rankRefresh:()=>{carregarRanking();},
  rankSend:()=>{enviarRanking(true).then(ok=>{toast(ok?'Pontuação enviada!':'Não consegui enviar agora. Confira a internet.',ok?'good':'warn');if(ok){RK.quando=0;carregarRanking();}});},
  auditAns:i=>{if(audit.picked!==null)return;audit.picked=+i;snd(audit.ans[+i].right?'coin':'bad');renderAudit();},
  auditEnd:pts=>{pts=+pts;S.auds.push({dia:dayOf(S.t),pts});
    if(pts>=5){S.rep=clamp(S.rep+20,0,100);S.cash+=20000;log(`Auditor aprovou a fábrica (${pts} de 6)! +R$ 20.000.`,'gold');snd('trophy');}
    else if(pts>=3)log(`Passou raspando na auditoria (${pts} de 6).`,'warn');
    else{S.rep=clamp(S.rep-40,0,100);S.cash-=15000;log(`Reprovado na auditoria (${pts} de 6).`,'bad');}
    S.audPending=false;S.nextAud=dayOf(S.t)+7;audit=null;closeModal();save();},
  reset:()=>confirmModal('Tudo deste aparelho será apagado: prensas, equipe, caixa, troféus, patentes, tecnologias e universos. Seu lugar no ranking continua com o faturamento que já foi enviado.','resetYes','','Apagar tudo'),
  resetYes:()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(KEY_OLD);}catch(e){}S=null;Scene.ents={};closeModal();tab='fabrica';showStart();},
  restart:()=>{const meta=S&&S.meta,nome=S&&S.nome;Scene.ents={};closeModal();tab='fabrica';
    if(meta&&(meta.uni>1||meta.patTot>0)){S=newState(nome,meta);S.tro=[];log(`A fábrica reabriu no Universo ${meta.uni}. Suas tecnologias continuam valendo.`,'gold');save();}
    else{try{localStorage.removeItem(KEY);}catch(e){}S=null;showStart();}}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(!f)return;
  if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
  f(b.dataset.arg);
  if(S){checkMissions();if(!modal)sig='';save();updateLive();}
});
function assignOp(p,sid){
  S.press.forEach(x=>{if(x!==p&&sid&&x.op===sid)x.op=null;});
  const prev=p.op;p.op=sid||null;
  const s=sid&&staffById(sid);log(s?`${s.nome} assumiu a Prensa ${p.n}.`:`Prensa ${p.n} ficou sem operador.`,s?'':'warn');
  return prev;
}
document.addEventListener('change',e=>{
  const el=e.target;if(!S)return;
  if(el.dataset.act==='setmat'){const p=pressById(el.dataset.arg);if(p){p.mat=el.value||null;const m=matrizDaPrensa(S,p);snd('click');if(m){const c=pressCenter(p);floatAt(c.x,c.y,nomeMatriz(m),'good');}sceneLabels();}el.blur();sig='';save();if(modal==='press')showPress(p.id);return;}
  if(el.dataset.act==='setop'){const p=pressById(el.dataset.arg);if(p){assignOp(p,el.value);}el.blur();sig='';save();if(modal==='press')showPress(p.id);}
  if(el.dataset.act==='setpress'){const s=staffById(el.dataset.arg);if(!s)return;S.press.forEach(x=>{if(x.op===s.id)x.op=null;});const p=pressById(el.value);if(p)assignOp(p,s.id);el.blur();sig='';save();showStaff(s.id);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&['confirm','press','staff','buy','help'].includes(modal))closeModal();
  if(e.key==='Enter'&&modal==='start'&&(e.target.id==='plantInput'||e.target.id==='playerInput'))ACT.start();
  if(e.key==='Enter'&&e.target.id==='apelidoInput'){ACT.joinRank();sig='';}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&['press','staff','buy','help'].includes(modal))closeModal();});

// ---------- laço principal ----------
let pressing=false;
document.addEventListener('pointerdown',()=>{pressing=true;},true);
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>setTimeout(()=>{pressing=false;},0),true));
let lastT=performance.now(),lastDraw=0,lastPort=0,lastRank=performance.now()-90000;
function loop(now){
  let real=(now-lastT)/1000;lastT=now;real=clamp(real,0,0.5);
  if(S){
    if(!S.over&&S.speed>0&&!S.audPending&&!['audit','start','over','confirm','offline','daily'].includes(modal)){
      let g=real*4*S.speed;
      while(g>1e-9){const st=Math.min(2,g);simStep(S,st,ev);g-=st;if(S.audPending)break;}
      checkMissions();checkNivel();
      if(S.cash<BANKRUPT)S.over=true;
    }
    if(!modal&&FILA.length){FILA.shift()();}
    else if(!['audit','over','start','offline','daily'].includes(modal)){if(S.over){closeModal();showOver();}else if(S.audPending){closeModal();showAudit();}}
    const s=signature();
    const selFocus=document.activeElement&&['SELECT','INPUT'].includes(document.activeElement.tagName);
    if(s!==sig&&!selFocus&&!pressing){sig=s;render();}else updateLive();
    if(tab==='fabrica'&&sceneEl.isConnected){sceneUpdate(now,real);if(now-lastDraw>(RM?500:60)){sceneDraw(sceneCv,now);lastDraw=now;}}
    if(now-lastPort>(RM?1000:120)){drawPortraits(now);lastPort=now;}
    if(now-lastSave>3000){save();lastSave=now;}
    if(tab==='progresso')drawPortal(now);
    if(now-lastRank>120000){lastRank=now;enviarRanking(false);if(tab==='ranking')carregarRanking();}
  }
  requestAnimationFrame(loop);
}
let escondidoEm=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();escondidoEm=Date.now();}
  else if(S&&escondidoEm){const seg=(Date.now()-escondidoEm)/1000;escondidoEm=0;voltarDeFora(seg);checkDiario();sig='';}
});
S=loadSave();
if(S){
  normalizar(S);
  if(S.savedAt)voltarDeFora((Date.now()-S.savedAt)/1000);
  checkDiario();
  if(rankLigado()&&!JOG.apelido){JOG.apelido=limparApelido(S.nome)||'Gerente';saveJog();}
  render();setTimeout(()=>enviarRanking(true),1500);
}else showStart();
requestAnimationFrame(t=>{lastT=t;loop(t);});

</script>
</body></html>
